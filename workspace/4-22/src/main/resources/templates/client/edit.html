<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="common/head :: head_fragment(title = '登録情報編集', scripts = ~{::script}, links = ~{::link})"></head>

<body>
	<div class="container">

		<h1>登録情報編集</h1>
		

		<form th:action="@{/client/update}" th:object="${clientUpdateRequest}" th:method="post">

			<input type="hidden" th:field="*{id}"/>

			<div>
				<div class="form-group">
					<div class="col-2 pt-3 border bg-light">店舗名<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<span class="text-danger" th:if="${#fields.hasErrors('storeName')}" th:errors="*{storeName}"></span>
						<input type="text" class="form-control">	
					</div>

				</div>
				<div class="form-group">
					<div class="col-2 pt-3 border bg-light">勤務形態<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<span class="text-danger" th:if="${#fields.hasErrors('workStyle')}" th:errors="*{workStyle}"></span>
						<input type="text" class="form-control">
					</div>
				</div>

				<div class="form-group">
					<div class="col-2 pt-3 border bg-light">店舗住所<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<span class="text-danger" th:if="${#fields.hasErrors('storeAddress')}"th:errors="*{storeAddress}"></span>
						<input type="text" class="form-control">
					</div>
				</div>

				<div class="form-group">
					<div class="col-2 pt-3 border bg-light">店舗電話番号<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<span class="text-danger" th:if="${#fields.hasErrors('tellNumber')}" th:errors="*{tellNumber}"></span>
						<input type="text" class="form-control">
					</div>
				</div>
				
			</div>

			<br />
			<div class="text-center">
				<input type="submit" class="btn btn-primary" value="保存">
				<a th:href="@{/client/{id}(id=*{id})}" class="btn btn-secondary">キャンセル</a>
			</div>
		</form>
	</div>
</body>

</html>
