<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="common/head :: head_fragment(title = '新規登録', scripts = ~{::script}, links = ~{::link})"></head>

<body>
	<div class="container">
		
		<h1>新規登録</h1>
		<form th:action="@{/client/create}" th:object="${clientRequest}" th:method="post">

			<div class="form-group">
				<label>店舗名：<span class="text-danger">※</span></label>
				<span class="text-danger" th:if="${#fields.hasErrors('storeName')}" th:errors="*{storeName}"></span>
				<input type="text" th:field="*{storeName}" class="form-control">

			</div>

			<div class="form-group">
				<label>稼働形態：<span class="text-danger">※</span></label>
				<span class="text-danger" th:if="${#fields.hasErrors('workStyle')}" th:errors="*{workStyle}"></span>
				<input type="text" th:field="*{workStyle}" class="form-control">

			</div>

			<div class="form-group">
				<label>店舗住所：<span class="text-danger">※</span></label>
				<span class="text-danger" th:if="${#fields.hasErrors('storeAddress')}"th:errors="*{storeAddress}"></span>
				<input type="text" th:field="*{storeAddress}" class="form-control">

			</div>

			<div class="form-group">
				<label>店舗電話番号<span class="text-danger">※</span></label>
				<span class="text-danger" th:if="${#fields.hasErrors('tellNumber')}" th:errors="*{tellNumber}"></span>
				<input type="text" th:field="*{tellNumber}" class="form-control">

			</div>

			<br />
			<div class="text-center">

				<a href="/client/list" class="btn btn-secondary">キャンセル</a>
				<input type="submit" value="登録" class="btn btn-primary">
			</div>

		</form>
	</div>
</body>

</html>
