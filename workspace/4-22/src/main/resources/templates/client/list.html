<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">

<head th:replace="common/head :: head_fragment(title = '店舗情報一覧',scripts = ~{::script},links = ~{::link})"></head>

<body>
	<div class="container">
		<h1>店舗情報一覧</h1>
		<div class="float-end">
			<a th:href="@{/client/add}" class="btn btn-primary">追加</a>
		</div>

		<table class="table table-striped">
			<thead>
				<tr>
					<th>ID</th>
					<th>店舗名</th>
					<th>稼働形態</th>
					<th>店舗住所</th>
					<th>店舗電話番号</th>
				</tr>
			</thead>

			<tbody>
			   <tr th:each="client : ${clientlist}" th:object="${client}" class="align-middle">
			    <td th:text="*{Id}"></td>
			    <td th:text="*{storeName}"></td>
			    <td th:text="*{workStyle}"></td>
			    <td th:text="*{storeAddress}"></td>
			    <td th:text="*{tellNumber}"></td>
			    <td>
			    <td><a th:href="@{/client/{id}(id=${client.id})}" class="btn btn-secondary">詳細</th></td>
			   </tr>
			  </tbody>
			  
				</tr>
			</tbody>
		</table>

	</div>
</body>

</html>
