<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="common/head :: head_fragment(title = '登録情報編集', scripts = ~{::script}, links = ~{::link})"></head>

<body>
	<div class="container">

		<h1>登録情報編集</h1>
		

		<form th:action="@{/beauty/update}" th:object="${beautyUpdateRequest}" th:method="post">

			<input type="hidden" th:field="*{id}"/>

			<div>
				<div class="form-group">
					<div class="col-2 pt-3 border bg-light">メーカー名<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<span class="text-danger" th:if="${#fields.hasErrors('makerName')}" th:errors="*{makerName}"></span>
						<input type="text" class="form-control" th:field="*{makerName}">	
					</div>

				</div>
				<div class="form-group">
					<div class="col-2 pt-3 border bg-light">開催期間<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<span class="text-danger" th:if="${#fields.hasErrors('period')}" th:errors="*{period}"></span>
						<input type="text" class="form-control" th:field="*{period}">
					</div>
				</div>

				<div class="form-group">
					<div class="col-2 pt-3 border bg-light">エリア<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<span class="text-danger" th:if="${#fields.hasErrors('area')}"th:errors="*{area}"></span>
						<input type="text" class="form-control"th:field="*{area}">
					</div>
				</div>

				<div class="form-group">
					<div class="col-2 pt-3 border bg-light">会場名<span class="text-danger">※</span></div>
					<div class="col py-2 border">
						<span class="text-danger" th:if="${#fields.hasErrors('place')}" th:errors="*{place}"></span>
						<input type="text" class="form-control"th:field="*{place}">
					</div>
				</div>
				
			</div>

			<br />
			<div class="text-center">
				<input type="submit" class="btn btn-primary" value="保存">
				<a th:href="@{/beauty/{id}(id=*{id})}" class="btn btn-secondary">キャンセル</a>
			</div>
		</form>
	</div>
</body>

</html>
